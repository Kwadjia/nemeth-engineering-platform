[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemeth-api"
version = "0.1.0"
description = "NEMETH Engineering Platform API — PLM, BOM, experiments and traceability for NEMETH Detroit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]

[project.scripts]
nemeth = "nemeth.__main__:main"

[tool.setuptools.packages.find]
include = ["nemeth*"]

# --- Ruff: linting (formatting is Black's job) ---------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nemeth", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "N",        # pep8-naming
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "T20",      # no stray print()
]
ignore = [
  "E501",     # line length is enforced by Black
  "B008",     # FastAPI Depends() in defaults is idiomatic
  "RUF012",   # mutable class attributes are fine for SQLAlchemy/Pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"alembic/**" = ["I"]
"nemeth/__main__.py" = ["T20"]
"nemeth/seed/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["nemeth"]

# --- Black ---------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --- mypy ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# --- pytest --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Domain classes are named Test* (TestRun, TestType); only functions are tests here.
python_classes = "Suite*"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:nemeth.*"]
